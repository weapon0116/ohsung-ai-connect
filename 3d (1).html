<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D 조립 시뮬레이터 - 아두이노 초음파 농구 골대</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #f1f5f9;
      user-select: none;
    }
    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .thin-scrollbar::-webkit-scrollbar {
      width: 5px;
    }
    .thin-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .thin-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 999px;
    }
    input[type="range"].assembly-slider {
      -webkit-appearance: none;
      appearance: none;
      height: 8px;
      border-radius: 999px;
      background: #e2e8f0;
      outline: none;
    }
    input[type="range"].assembly-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #d97706;
      border: 3px solid #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
      cursor: pointer;
    }
  </style>
</head>
<body class="text-slate-800">
  <!-- Three.js 3D Viewport -->
  <div id="canvas-container"></div>

  <!-- Top Header & Camera Presets -->
  <header class="fixed top-3 left-3 right-3 z-30 flex flex-col lg:flex-row lg:items-center justify-between gap-2 pointer-events-none">
    <div class="bg-white/90 backdrop-blur-md border border-slate-200/80 shadow-sm rounded-2xl px-4 py-2 pointer-events-auto flex items-center justify-between gap-3">
      <div>
        <div class="flex items-center gap-2">
          <span class="px-2 py-0.5 text-[11px] font-bold rounded-full bg-amber-100 text-amber-800">3mm 합판</span>
          <h1 class="text-sm sm:text-base font-bold text-slate-900 tracking-tight">아두이노 초음파 농구 골대 3D 조립 가이드</h1>
        </div>
        <p class="text-[11px] text-slate-500 hidden sm:block">천안오성고등학교 인공지능중점학교 · 마우스 드래그 회전 / 휠 확대·축소</p>
      </div>
      <div class="flex items-center gap-1.5 shrink-0">
        <button type="button" id="toggle-xray-btn" class="px-2.5 sm:px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 text-slate-700 hover:bg-slate-200 transition flex items-center gap-1.5">
          <span>🔍 투명 투시(아두이노·배선)</span>
        </button>
        <button type="button" id="toggle-labels-btn" class="px-2.5 sm:px-3 py-1.5 rounded-xl text-xs font-semibold bg-amber-600 text-white shadow-sm hover:bg-amber-700 transition flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-white"></span>
          <span>부품 번호 ON</span>
        </button>
      </div>
    </div>

    <!-- Camera View Buttons -->
    <div class="bg-white/90 backdrop-blur-md border border-slate-200/80 shadow-sm rounded-2xl p-1.5 pointer-events-auto flex items-center gap-1 overflow-x-auto no-scrollbar">
      <button type="button" data-cam="iso" class="cam-btn px-2.5 py-1.5 rounded-xl text-xs font-medium text-slate-700 hover:bg-slate-100 whitespace-nowrap transition">입체 전체</button>
      <button type="button" data-cam="front" class="cam-btn px-2.5 py-1.5 rounded-xl text-xs font-medium text-slate-700 hover:bg-slate-100 whitespace-nowrap transition">정면 ①</button>
      <button type="button" data-cam="back" class="cam-btn px-2.5 py-1.5 rounded-xl text-xs font-medium text-slate-700 hover:bg-slate-100 whitespace-nowrap transition">후면 ②(USB)</button>
      <button type="button" data-cam="right" class="cam-btn px-2.5 py-1.5 rounded-xl text-xs font-medium text-slate-700 hover:bg-slate-100 whitespace-nowrap transition">우측 R/④</button>
      <button type="button" data-cam="left" class="cam-btn px-2.5 py-1.5 rounded-xl text-xs font-medium text-slate-700 hover:bg-slate-100 whitespace-nowrap transition">좌측 L/③</button>
      <button type="button" data-cam="top" class="cam-btn px-2.5 py-1.5 rounded-xl text-xs font-medium text-slate-700 hover:bg-slate-100 whitespace-nowrap transition">상단 백보드</button>
      <button type="button" data-cam="inside" class="cam-btn px-2.5 py-1.5 rounded-xl text-xs font-semibold text-blue-700 bg-blue-50 hover:bg-blue-100 whitespace-nowrap transition">박스 내부(아두이노)</button>
    </div>
  </header>

  <!-- Floating Expand Button (Shown when Left Sidebar is Collapsed) -->
  <button
    type="button"
    id="expand-sidebar-btn"
    class="fixed top-[120px] lg:top-[76px] left-3 z-20 px-3.5 py-2.5 rounded-2xl bg-white/95 backdrop-blur-md border border-slate-200/90 shadow-lg hover:bg-amber-50 text-slate-800 transition-all duration-300 flex items-center gap-2 -translate-x-[150%] opacity-0 pointer-events-none"
    aria-label="조립 가이드 패널 펼치기"
  >
    <span class="text-amber-600 font-bold text-xs">▶</span>
    <span class="text-xs font-bold text-slate-900">조립 가이드</span>
    <span id="collapsed-step-badge" class="px-1.5 py-0.5 rounded-md text-[10px] font-bold bg-amber-100 text-amber-800">0/11</span>
  </button>

  <!-- Left Collapsible Assembly Guide Sidebar -->
  <aside
    id="guide-sidebar"
    class="fixed top-[120px] lg:top-[76px] left-3 bottom-3 z-20 w-[332px] max-w-[calc(100vw-24px)] transition-transform duration-300 ease-out translate-x-0 pointer-events-none flex flex-col"
  >
    <div class="w-full h-full bg-white/95 backdrop-blur-md border border-slate-200/90 shadow-xl rounded-2xl pointer-events-auto flex flex-col overflow-hidden">
      <!-- Sidebar Header with Collapse Button -->
      <div class="px-3.5 py-2.5 border-b border-slate-200/80 flex items-center justify-between gap-2 bg-slate-50/70 shrink-0">
        <div class="flex items-center gap-2 min-w-0">
          <span id="step-badge" class="px-2 py-0.5 rounded-md text-[11px] font-bold bg-amber-100 text-amber-800 shrink-0">STEP 0 / 11</span>
          <span id="progress-percent" class="text-xs font-bold text-slate-600">0%</span>
        </div>
        <button
          type="button"
          id="collapse-sidebar-btn"
          class="px-2.5 py-1 rounded-xl text-xs font-semibold bg-slate-200/80 hover:bg-slate-300/80 text-slate-700 transition flex items-center gap-1 shrink-0"
          title="조립 가이드 접기"
        >
          <span>◀ 접기</span>
        </button>
      </div>

      <!-- Compact Step Selector Pills (0~11) -->
      <div class="px-3 pt-2.5 pb-2 border-b border-slate-200/70 shrink-0">
        <div class="grid grid-cols-3 gap-1">
          <button type="button" data-step="0" class="step-pill px-2 py-1.5 rounded-lg text-[11px] font-semibold truncate transition bg-amber-600 text-white shadow-sm">0. 펼침</button>
          <button type="button" data-step="1" class="step-pill px-2 py-1.5 rounded-lg text-[11px] font-semibold truncate transition bg-slate-100 text-slate-600 hover:bg-slate-200">1. 상자(B/1~4)</button>
          <button type="button" data-step="2" class="step-pill px-2 py-1.5 rounded-lg text-[11px] font-semibold truncate transition bg-slate-100 text-slate-600 hover:bg-slate-200">2. 아두이노</button>
          <button type="button" data-step="3" class="step-pill px-2 py-1.5 rounded-lg text-[11px] font-semibold truncate transition bg-slate-100 text-slate-600 hover:bg-slate-200">3. USB 연결</button>
          <button type="button" data-step="4" class="step-pill px-2 py-1.5 rounded-lg text-[11px] font-semibold truncate transition bg-slate-100 text-slate-600 hover:bg-slate-200">4. 네오픽셀·T</button>
          <button type="button" data-step="5" class="step-pill px-2 py-1.5 rounded-lg text-[11px] font-semibold truncate transition bg-slate-100 text-slate-600 hover:bg-slate-200">5. 선 빼기</button>
          <button type="button" data-step="6" class="step-pill px-2 py-1.5 rounded-lg text-[11px] font-semibold truncate transition bg-slate-100 text-slate-600 hover:bg-slate-200">6. 기둥 1→4</button>
          <button type="button" data-step="7" class="step-pill px-2 py-1.5 rounded-lg text-[11px] font-semibold truncate transition bg-slate-100 text-slate-600 hover:bg-slate-200">7. 선 뒤로</button>
          <button type="button" data-step="8" class="step-pill px-2 py-1.5 rounded-lg text-[11px] font-semibold truncate transition bg-slate-100 text-slate-600 hover:bg-slate-200">8. 초음파</button>
          <button type="button" data-step="9" class="step-pill px-2 py-1.5 rounded-lg text-[11px] font-semibold truncate transition bg-slate-100 text-slate-600 hover:bg-slate-200">9. 상부 T캡</button>
          <button type="button" data-step="10" class="step-pill px-2 py-1.5 rounded-lg text-[11px] font-semibold truncate transition bg-slate-100 text-slate-600 hover:bg-slate-200">10. 백보드·링</button>
          <button type="button" data-step="11" class="step-pill px-2 py-1.5 rounded-lg text-[11px] font-semibold truncate transition bg-slate-100 text-slate-600 hover:bg-slate-200">11. 센서 부착</button>
        </div>
      </div>

      <!-- Scrollable Current Step Details & Tip -->
      <div class="flex-1 overflow-y-auto thin-scrollbar p-3 space-y-2.5">
        <div class="bg-slate-50/90 border border-slate-200/70 rounded-xl p-3 space-y-1.5">
          <h2 id="step-title" class="text-sm font-bold text-slate-900 leading-snug">0단계: 전체 부품 펼침 및 도안 대조</h2>
          <p id="step-parts-tag" class="text-[11px] font-semibold text-amber-800 leading-snug"></p>
          <p id="step-desc" class="text-xs text-slate-700 leading-relaxed pt-0.5"></p>
        </div>

        <div class="bg-amber-50/90 border border-amber-200/80 rounded-xl p-3 text-[11px] text-amber-950 leading-relaxed">
          <span class="font-bold block mb-1 text-amber-800">💡 매뉴얼 체크포인트</span>
          <span id="step-tip"></span>
        </div>
      </div>

      <!-- Playback & Progress Slider (Anchored at Bottom of Sidebar) -->
      <div class="p-3 border-t border-slate-200/80 bg-slate-50/70 space-y-2.5 shrink-0">
        <div class="flex items-center gap-2">
          <input id="progress-slider" type="range" min="0" max="1100" value="0" class="assembly-slider w-full" aria-label="조립 진행률 슬라이더" />
        </div>
        <div class="flex items-center justify-between gap-2">
          <button type="button" id="prev-btn" class="px-3 py-2 rounded-xl bg-slate-200/80 hover:bg-slate-300/80 text-slate-700 text-xs font-semibold transition flex items-center gap-1" title="이전 단계">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
            <span>이전</span>
          </button>

          <button type="button" id="play-btn" class="flex-1 py-2 rounded-xl bg-amber-600 hover:bg-amber-700 text-white text-xs font-semibold shadow-sm transition flex items-center justify-center gap-1.5">
            <svg id="play-icon" class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <span id="play-text">자동 조립</span>
          </button>

          <button type="button" id="next-btn" class="px-3 py-2 rounded-xl bg-slate-200/80 hover:bg-slate-300/80 text-slate-700 text-xs font-semibold transition flex items-center gap-1" title="다음 단계">
            <span>다음</span>
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
          </button>
        </div>
      </div>
    </div>
  </aside>

  <script>
    // =========================================================================
    // 1. PDF 매뉴얼(0~11단계) 기준 조립 데이터
    // =========================================================================
    const STEPS_DATA = [
      {
        step: 0,
        title: "0단계: 전체 부품 펼침 및 도안 대조",
        parts: "하판(B), 측면(①~④), 상판(T), 기둥 4종(정면·중앙개구·L·R), 상부 T 연결판, 백보드(F), 링, 센서류",
        desc: "레이저 커팅 판재에서 목재 부품을 분리하고, 각인된 번호와 기호(B, ①~④, T, L, R, F)를 확인합니다.",
        tip: "우측 상단 [🔍 투명 투시] 버튼을 누르면 상자 속 아두이노 배치와 기둥 안팎으로 통과하는 배선 경로를 투명하게 확인할 수 있습니다."
      },
      {
        step: 1,
        title: "1단계: B / 1 / 2 / 3 / 4 상자 모양으로 조립",
        parts: "하판(B) + 정면(①), 후면(②), 좌측(③), 우측(④)",
        desc: "바닥판 B를 중심으로 정면 ①, 후면 ②(사각 USB 구멍), 좌측 ③, 우측 ④ 블록을 화살표 방향에 맞춰 끼워 상자 모양을 만듭니다.",
        tip: "사각 구멍이 뚫린 ②번 블록이 뒤쪽(후면)에 오도록 조립해야 다음 단계에서 USB 선을 연결할 수 있습니다."
      },
      {
        step: 2,
        title: "2단계: 아두이노 집어 넣기",
        parts: "아두이노 우노 (점퍼선에서 센서 제거, 네오픽셀은 아두이노에서 제거)",
        desc: "상자 안에 아두이노 우노를 넣습니다. 넣기 전 점퍼선에서 센서들을 분리하고, 네오픽셀 선은 아두이노에서 분리해 둡니다.",
        tip: "아두이노의 은색 USB 단자가 ②번 블록의 사각 구멍 쪽을 향하도록 상자 내부에 배치하세요."
      },
      {
        step: 3,
        title: "3단계: 2번 블록의 구멍으로 USB 선 연결",
        parts: "파란색 USB 케이블 → ②번 블록 사각 구멍",
        desc: "후면 ②번 블록의 사각 구멍을 통해 상자 안쪽 아두이노 포트에 파란색 USB 선을 꽂아 연결합니다.",
        tip: "상판(T)을 덮기 전에 USB 케이블이 ②번 구멍을 통과해 아두이노에 단단히 꽂혔는지 먼저 확인합니다."
      },
      {
        step: 4,
        title: "4단계: 네오픽셀 선 T 가운데 구멍을 통해 아두이노에 연결",
        parts: "상판(T) + 네오픽셀 3가닥 선(검정·빨강·노랑)",
        desc: "상판(T)을 덮기 전, 네오픽셀 링의 3가닥 점퍼선(검정·빨강·노랑)을 상판 T의 정중앙 사각 구멍으로 통과시켜 아두이노 핀에 연결합니다.",
        tip: "천안오성고등학교 로고와 'T' 각인이 정면(①번 방향)에 오도록 상판(T)의 방향을 맞춰주세요."
      },
      {
        step: 5,
        title: "5단계: 안에 있는 선들 모두 밖으로 빼기",
        parts: "초음파 센서 4선(파랑·초록·빨강·노랑) + 버튼/부저 선 다발",
        desc: "상자 안 아두이노에 꽂혀 있는 나머지 점퍼선들(초음파 센서 4선 및 버튼·부저 선)을 모두 상판 T 중앙 사각 구멍 밖으로 빼낸 뒤 T를 덮습니다.",
        tip: "선을 밖으로 뺀 뒤 어느 색 조합이 무슨 센서(초음파 4선, 버튼, 부저)인지 미리 기억해 두세요!"
      },
      {
        step: 6,
        title: "6단계: 색에 맞게 기둥 설치하기 (순서 1 → 2 → 3 → 4)",
        parts: "① 정면(앞, 초록) → ② 중앙이 뚫려있는 기둥(노랑) → ③ L(좌측, 파랑) → ④ R(우측, 빨강)",
        desc: "상판 T의 슬롯 색상에 맞춰 ① 정면(앞) → ② 중앙이 뚫려있는 기둥(후면) → ③ L(좌측) → ④ R(우측) 순서로 끼웁니다. 이때 모든 선은 기둥 안쪽으로 통과시킵니다.",
        tip: "L(좌측)과 R(우측) 기둥의 초음파 센서용 파임 홈이 모두 정면(+Z)을 향하도록 방향을 맞춰 끼워주세요."
      },
      {
        step: 7,
        title: "7단계: 초음파 센서(4개짜리) 제외한 나머지 선들(+네오픽셀) 뒤로 빼기",

        desc: "초음파 센서용 4가닥 선만 기둥 안쪽에 남겨 위로 올리고, 네오픽셀 선과 버튼·부저 선들은 모두 '중앙이 뚫려있는 기둥'의 긴 창 구멍을 통해 뒤쪽으로 빼냅니다.",
        tip: "네오픽셀 선(3가닥)은 뒤로 뺀 뒤 기둥을 타고 올라가 상단 백보드(F) 쪽으로 넘어가게 됩니다."
      },
      {
        step: 8,
        title: "8단계: 초음파 센서 기둥에 끼우기",
        parts: "초음파 센서(HC-SR04) + 기둥 안쪽 4가닥 점퍼선",
        desc: "기둥 내부에 남겨둔 4가닥 점퍼선(파랑·초록·빨강·노랑)을 초음파 센서 핀에 연결하고, 정면 기둥 바로 위 좌우 기둥의 파인 홈에 초음파 센서를 정면 방향으로 끼웁니다.",
        tip: "초음파 센서 기판이 좌·우(L/R) 기둥 정면 홈에 딱 맞게 들어가고, 두 원통(송·수신부)이 골대 링 바로 아래 정면을 바라보도록 끼워주세요."
      },
      {

        tip: "조립 완료! 상단 시점 버튼을 눌러 정면·후면·상단 백보드 연결 상태를 최종 확인해 보세요."

    function initApp() {
      if (typeof THREE === 'undefined') {
        console.error('THREE library failed to load.');
        return;
      }

      // =========================================================================
      // 2. Three.js 씬 & 카메라 & 조명 초기화
      // =========================================================================
      let container = document.getElementById('canvas-container');
      if (!container) {
        container = document.createElement('div');
        container.id = 'canvas-container';
        container.style.position = 'fixed';
        container.style.inset = '0';
        container.style.width = '100%';
        container.style.height = '100%';
        container.style.zIndex = '1';
        (document.body || document.documentElement).prepend(container);
      }

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xf1f5f9);
      scene.fog = new THREE.Fog(0xf1f5f9, 45, 110);

      const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 200);
      camera.position.set(16, 15, 20);

      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputEncoding = THREE.sRGBEncoding;
      container.appendChild(renderer.domElement);

      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.target.set(0, 7.2, 0);
      controls.minDistance = 5;
      controls.maxDistance = 60;
      controls.maxPolarAngle = Math.PI * 0.49;

      // Studio Lighting
      const hemiLight = new THREE.HemisphereLight(0xffffff, 0xe2e8f0, 0.78);
      hemiLight.position.set(0, 30, 0);
      scene.add(hemiLight);

      const dirLight = new THREE.DirectionalLight(0xfffbeb, 0.85);
      dirLight.position.set(14, 24, 16);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 2048;
      dirLight.shadow.mapSize.height = 2048;
      dirLight.shadow.camera.near = 2;
      dirLight.shadow.camera.far = 65;
      const d = 22;
      dirLight.shadow.camera.left = -d;
      dirLight.shadow.camera.right = d;
      dirLight.shadow.camera.top = d;
      dirLight.shadow.camera.bottom = -d;
      dirLight.shadow.bias = -0.0005;
      scene.add(dirLight);

      const fillLight = new THREE.DirectionalLight(0xe0f2fe, 0.35);
      fillLight.position.set(-15, 12, -14);
      scene.add(fillLight);

      // Workbench Grid & Ground Plane
      const gridHelper = new THREE.GridHelper(48, 48, 0xcbd5e1, 0xe2e8f0);
      gridHelper.position.y = 0;
      scene.add(gridHelper);

      const groundGeo = new THREE.PlaneGeometry(120, 120);
      const groundMat = new THREE.ShadowMaterial({ opacity: 0.14 });
      const groundMesh = new THREE.Mesh(groundGeo, groundMat);
      groundMesh.rotation.x = -Math.PI / 2;
      groundMesh.receiveShadow = true;
      scene.add(groundMesh);

      // =========================================================================
      // 3. 자작나무 합판 텍스처 & 레이저 각인 생성기 + UV 정규화
      // =========================================================================
      function createWoodTexture(options = {}) {
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = '#e7cfa8';
        ctx.fillRect(0, 0, 512, 512);

        for (let i = 0; i < 140; i++) {
          const y = (i / 140) * 512;
          ctx.strokeStyle = i % 3 === 0 ? 'rgba(185, 145, 92, 0.14)' : 'rgba(255, 245, 228, 0.18)';
          ctx.lineWidth = 1 + Math.random() * 2.5;
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.bezierCurveTo(170, y + Math.sin(i) * 4, 340, y - Math.cos(i) * 4, 512, y);
          ctx.stroke();
        }

        ctx.strokeStyle = '#5c3317';
        ctx.fillStyle = '#6b3e1e';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        if (options.letter) {
          ctx.font = `bold ${options.letter.size || 64}px Inter, sans-serif`;
          ctx.lineWidth = 2.5;
          ctx.strokeText(options.letter.text, options.letter.x, options.letter.y);
          ctx.fillText(options.letter.text, options.letter.x, options.letter.y);
        }

        if (options.circleNumber) {
          const { text, x, y, r = 34 } = options.circleNumber;
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.stroke();
          ctx.font = `bold ${Math.round(r * 1.15)}px Inter, sans-serif`;
          ctx.fillText(text, x, y + 2);
        }

        if (options.schoolLogo) {
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.arc(135, 395, 22, 0, Math.PI * 2);
          ctx.stroke();
          ctx.font = 'bold 21px Inter, sans-serif';
          ctx.fillText('천안오성고등학교', 275, 383);
          ctx.font = '600 17px Inter, sans-serif';
          ctx.fillText('인공지능중점학교', 275, 410);
        }

        const texture = new THREE.CanvasTexture(canvas);
        texture.encoding = THREE.sRGBEncoding;
        texture.anisotropy = 4;
        return texture;
      }

      /**
       * ExtrudeGeometry의 앞/뒷면 UV를 [0, 1] 범위로 정규화하여
       * 합판 텍스처와 레이저 각인(B, 1~4, T, L, R, F, 로고)이 정확히 표시되도록 함.
       */
      function normalizeExtrudeUVs(geometry) {
        geometry.computeBoundingBox();
        const box = geometry.boundingBox;
        const sizeX = Math.max(0.0001, box.max.x - box.min.x);
        const sizeY = Math.max(0.0001, box.max.y - box.min.y);
        const pos = geometry.attributes.position;
        const uv = geometry.attributes.uv;
        if (!pos || !uv) return;

        for (let i = 0; i < pos.count; i++) {
          const u = (pos.getX(i) - box.min.x) / sizeX;
          const v = (pos.getY(i) - box.min.y) / sizeY;
          uv.setXY(i, u, v);
        }
        uv.needsUpdate = true;
      }

      const baseWoodTex = createWoodTexture();
      const laserEdgeMat = new THREE.MeshStandardMaterial({
        color: 0x3b210e,
        roughness: 0.85,
        metalness: 0.05
      });

      function createPlywoodMesh(geometry, engravingOptions = null) {
        normalizeExtrudeUVs(geometry);
        const tex = engravingOptions ? createWoodTexture(engravingOptions) : baseWoodTex;
        const faceMat = new THREE.MeshStandardMaterial({
          map: tex,
          roughness: 0.68,
          metalness: 0.02,
          transparent: true,
          opacity: 1.0
        });

        const edgeMatClone = laserEdgeMat.clone();
        edgeMatClone.transparent = true;
        edgeMatClone.opacity = 1.0;

        const mesh = new THREE.Mesh(geometry, [faceMat, edgeMatClone]);
        mesh.castShadow = true;
        mesh.receiveShadow = true;

        const edges = new THREE.EdgesGeometry(geometry, 28);
        const line = new THREE.LineSegments(
          edges,
          new THREE.LineBasicMaterial({ color: 0x3b210e, transparent: true, opacity: 0.48 })
        );
        mesh.add(line);

        mesh.userData.faceMat = faceMat;
        mesh.userData.edgeMat = edgeMatClone;
        mesh.userData.isWood = true;
        return mesh;
      }

      // =========================================================================
      // 4. 정확한 치수 상수 (모든 맞물림 좌표 단일 기준화)
      // =========================================================================
      const T = 0.24;               // 3mm 합판 두께
      const BOX_W = 8.4;            // 하단 상자 가로/세로
      const BOX_H = 3.6;            // 하단 상자 높이
      const PILLAR_W = 1.9;         // 기둥 단면 폭
      const PILLAR_H = 12.6;        // 기둥 높이 (L, R, 후면)

      const PILLAR_BASE_Y = BOX_H + 0.15 + T;           // 3.99 (상판 T 윗면)
      const PILLAR_CENTER_Y = PILLAR_BASE_Y + PILLAR_H / 2; // 10.29
      const PILLAR_TOP_Y = PILLAR_BASE_Y + PILLAR_H;    // 16.59 (기둥 몸체 최상단)

      // 상부 T 연결판 Y 중심 (아랫면이 PILLAR_TOP_Y에 딱 얹힘)
      const TOP_CAP_Y = PILLAR_TOP_Y + T / 2;           // 16.71

      // 전면 백보드(F) 치수 및 위치
      const BB_W = 5.4;
      const BB_H = 4.35;
      const BB_TOP_SLOT_LOCAL_Y = 1.75;                 // 백보드 상단 3개 슬롯의 로컬 Y
      const BB_Y = TOP_CAP_Y - BB_TOP_SLOT_LOCAL_Y;     // 14.96 (상부 T 연결판 3개 갈고리와 정확히 일치)
      const BB_Z = PILLAR_W / 2 + T / 2 + 0.02;         // 1.09 (뒷면 0.97이 기둥 정면 0.95와 밀착)

      // 원형 농구 골대 링 높이 및 Z 위치 (돋보기 손잡이가 백보드 하단 슬롯 -> 후면 기둥 홈에 박힘)
      const RIM_SLOT_LOCAL_Y = -BB_H / 2 + 0.45;        // -1.725
      const RIM_Y = BB_Y + RIM_SLOT_LOCAL_Y;            // 13.235
      const RIM_OUTER_R = 1.68;
      const RIM_INNER_R = 1.34;
      const RIM_TAB_W = 0.72;
      const RIM_TAB_LEN = 2.45;                         // 링 외곽에서 뒤로 2.45 연장 -> 후면 기둥 관통 체결
      const RIM_Z = BB_Z + T / 2 + RIM_OUTER_R + 0.16;  // 3.05

      // 초음파 센서 위치 (골대 링 손잡이 바로 아래, 충돌 없이 정면 홈에 딱 맞게 삽입)
      const SENSOR_Y = RIM_Y - 1.02;                    // 12.215
      const SENSOR_LOCAL_Y = SENSOR_Y - PILLAR_CENTER_Y;// +1.925

      // 정면(앞) 기둥 높이: 상판 T에서 시작해 초음파 센서 하단 바로 아래에서 깔끔하게 종료
      const FRONT_PILLAR_H = (SENSOR_Y - 0.50) - PILLAR_BASE_Y; // 7.725

      function createFingerPanelGeo(width, height, options = {}) {
        const {
          topTabs = false,
          bottomTabs = false,
          leftTabs = false,
          rightTabs = false,
          centerHole = null,
          circleHole = null,
          extraHoles = []
        } = options;

        const shape = new THREE.Shape();
        const hw = width / 2;
        const hh = height / 2;
        const tabW = 1.1;
        const tabD = T;

        shape.moveTo(-hw, -hh);

        if (bottomTabs) {
          shape.lineTo(-tabW * 1.6, -hh);
          shape.lineTo(-tabW * 1.6, -hh - tabD);
          shape.lineTo(-tabW * 0.6, -hh - tabD);
          shape.lineTo(-tabW * 0.6, -hh);
          shape.lineTo(tabW * 0.6, -hh);
          shape.lineTo(tabW * 0.6, -hh - tabD);
          shape.lineTo(tabW * 1.6, -hh - tabD);
          shape.lineTo(tabW * 1.6, -hh);
        }
        shape.lineTo(hw, -hh);

        if (rightTabs) {
          shape.lineTo(hw, -tabW * 0.65);
          shape.lineTo(hw + tabD, -tabW * 0.65);
          shape.lineTo(hw + tabD, tabW * 0.65);
          shape.lineTo(hw, tabW * 0.65);
        }
        shape.lineTo(hw, hh);

        if (topTabs) {
          shape.lineTo(tabW * 1.6, hh);
          shape.lineTo(tabW * 1.6, hh + tabD);
          shape.lineTo(tabW * 0.6, hh + tabD);
          shape.lineTo(tabW * 0.6, hh);
          shape.lineTo(-tabW * 0.6, hh);
          shape.lineTo(-tabW * 0.6, hh + tabD);
          shape.lineTo(-tabW * 1.6, hh + tabD);
          shape.lineTo(-tabW * 1.6, hh);
        }
        shape.lineTo(-hw, hh);

        if (leftTabs) {
          shape.lineTo(-hw, tabW * 0.65);
          shape.lineTo(-hw - tabD, tabW * 0.65);
          shape.lineTo(-hw - tabD, -tabW * 0.65);
          shape.lineTo(-hw, -tabW * 0.65);
        }
        shape.lineTo(-hw, -hh);

        if (centerHole) {
          const hole = new THREE.Path();
          const cw = centerHole.w / 2;
          const ch = centerHole.h / 2;
          const cy = centerHole.yOffset || 0;
          hole.moveTo(-cw, cy - ch);
          hole.lineTo(cw, cy - ch);
          hole.lineTo(cw, cy + ch);
          hole.lineTo(-cw, cy + ch);
          hole.closePath();
          shape.holes.push(hole);
        }

        if (circleHole) {
          const hole = new THREE.Path();
          hole.absarc(0, circleHole.yOffset || 0, circleHole.r, 0, Math.PI * 2, false);
          shape.holes.push(hole);
        }

        extraHoles.forEach(h => {
          const path = new THREE.Path();
          path.moveTo(h.x - h.w / 2, h.y - h.h / 2);
          path.lineTo(h.x + h.w / 2, h.y - h.h / 2);
          path.lineTo(h.x + h.w / 2, h.y + h.h / 2);
          path.lineTo(h.x - h.w / 2, h.y + h.h / 2);
          path.closePath();
          shape.holes.push(path);
        });

        const geo = new THREE.ExtrudeGeometry(shape, {
          depth: T,
          bevelEnabled: false,
          curveSegments: 32
        });
        // Z축만 중앙 정렬하여 X/Y 기준 좌표가 절대 틀어지지 않게 함
        geo.translate(0, 0, -T / 2);
        return geo;
      }

      // =========================================================================
      // 5. 부품별 3D 모델링 (0~11단계)
      // =========================================================================
      const assemblyParts = [];
      const labelSprites = [];
      let showLabels = true;
      let xrayMode = false;

      function createPartLabel(text) {
        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 64;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
        ctx.beginPath();
        if (ctx.roundRect) {
          ctx.roundRect(12, 8, 232, 48, 24);
        } else {
          ctx.rect(12, 8, 232, 48);
        }
        ctx.fill();

        ctx.strokeStyle = 'rgba(251, 191, 36, 0.85)';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 22px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, 128, 33);

        const tex = new THREE.CanvasTexture(canvas);
        tex.encoding = THREE.sRGBEncoding;
        const mat = new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true });
        const sprite = new THREE.Sprite(mat);
        sprite.scale.set(3.2, 0.8, 1);
        sprite.renderOrder = 999;
        return sprite;
      }

      function registerPart(config) {
        const group = new THREE.Group();
        group.add(config.mesh);

        if (config.label) {
          const sprite = createPartLabel(config.label);
          sprite.position.set(...(config.labelOffset || [0, 1.4, 0]));
          group.add(sprite);
          labelSprites.push(sprite);
        }

        scene.add(group);
        assemblyParts.push({
          ...config,
          group,
          assembledPos: new THREE.Vector3(...config.assembledPos),
          assembledRot: new THREE.Euler(...config.assembledRot),
          explodedPos: new THREE.Vector3(...config.explodedPos),
          explodedRot: new THREE.Euler(...config.explodedRot)
        });
      }

      // --- [STEP 1] B / 1 / 2 / 3 / 4 상자 모양 조립 ---
      const bottomGeo = createFingerPanelGeo(BOX_W, BOX_W, {
        topTabs: true, bottomTabs: true, leftTabs: true, rightTabs: true
      });
      const bottomMesh = createPlywoodMesh(bottomGeo, {
        letter: { text: 'B', x: 390, y: 390, size: 58 }
      });
      registerPart({
        id: 'B',
        name: '하판 (B)',
        label: '하판 B',
        stepIndex: 1,
        mesh: bottomMesh,
        assembledPos: [0, T / 2 + 0.15, 0],
        assembledRot: [-Math.PI / 2, 0, 0],
        explodedPos: [-10.0, T / 2, 7.0],
        explodedRot: [-Math.PI / 2, 0, 0],
        labelOffset: [0, 0, 0.8]
      });

      const side1Geo = createFingerPanelGeo(BOX_W, BOX_H, {
        bottomTabs: true, topTabs: true, leftTabs: true, rightTabs: true
      });
      const side1Mesh = createPlywoodMesh(side1Geo, {
        circleNumber: { text: '1', x: 400, y: 390, r: 34 }
      });
      registerPart({
        id: 'panel1',
        name: '정면 판 ①',
        label: '① 정면',
        stepIndex: 1,
        mesh: side1Mesh,
        assembledPos: [0, BOX_H / 2 + 0.15, BOX_W / 2 - T / 2],
        assembledRot: [0, 0, 0],
        explodedPos: [0, T / 2, 11.2],
        explodedRot: [-Math.PI / 2, 0, 0],
        labelOffset: [0, 0, 0.9]
      });

      const side2Geo = createFingerPanelGeo(BOX_W, BOX_H, {
        bottomTabs: true, topTabs: true, leftTabs: true, rightTabs: true,
        centerHole: { w: 1.2, h: 1.15, yOffset: -0.95 }
      });
      const side2Mesh = createPlywoodMesh(side2Geo, {
        circleNumber: { text: '2', x: 400, y: 390, r: 34 }
      });
      registerPart({
        id: 'panel2',
        name: '후면 판 ② (USB 구멍)',
        label: '② 후면(USB홈)',
        stepIndex: 1,
        mesh: side2Mesh,
        assembledPos: [0, BOX_H / 2 + 0.15, -BOX_W / 2 + T / 2],
        assembledRot: [0, Math.PI, 0],
        explodedPos: [0, T / 2, -11.2],
        explodedRot: [-Math.PI / 2, Math.PI, 0],
        labelOffset: [0, 0, 0.9]
      });

      const side3Geo = createFingerPanelGeo(BOX_W - T * 2, BOX_H, {
        bottomTabs: true, topTabs: true
      });
      const side3Mesh = createPlywoodMesh(side3Geo, {
        circleNumber: { text: '3', x: 400, y: 390, r: 34 }
      });
      registerPart({
        id: 'panel3',
        name: '좌측/측면 판 ③',
        label: '③ 측면',
        stepIndex: 1,
        mesh: side3Mesh,
        assembledPos: [-BOX_W / 2 + T / 2, BOX_H / 2 + 0.15, 0],
        assembledRot: [0, -Math.PI / 2, 0],
        explodedPos: [-10.8, T / 2, -4.5],
        explodedRot: [-Math.PI / 2, 0, Math.PI / 2],
        labelOffset: [0, 0, 0.9]
      });

      const side4Geo = createFingerPanelGeo(BOX_W - T * 2, BOX_H, {
        bottomTabs: true, topTabs: true
      });
      const side4Mesh = createPlywoodMesh(side4Geo, {
        circleNumber: { text: '4', x: 400, y: 390, r: 34 }
      });
      registerPart({
        id: 'panel4',
        name: '우측/측면 판 ④',
        label: '④ 측면',
        stepIndex: 1,
        mesh: side4Mesh,
        assembledPos: [BOX_W / 2 - T / 2, BOX_H / 2 + 0.15, 0],
        assembledRot: [0, Math.PI / 2, 0],

      // --- [STEP 6] 기둥 4종 (수정 2 & 3 & 4 반영) ---
      /**
       * 기둥 2D 형상 생성기:
       * - topTenon: 상부 T 연결판의 사각 구멍에 맞물리는 상단 돌기 { w, h }
       * - frontCutoutRight: 로컬 +X 방향 파임 (pillarL용: rotY = -PI/2 -> 월드 정면 +Z)
       * - frontCutoutLeft: 로컬 -X 방향 파임 (pillarR용: rotY = +PI/2 -> 월드 정면 +Z)
       * - centerRectHole: 후면 기둥 배선 인출용 긴 창
       * - rimSlot: 후면 기둥 림 손잡이 삽입용 가로 슬롯 { w, h, y }
       */
      function createPdfPillarGeo(options = {}) {
        const {
          height = PILLAR_H,
          width = PILLAR_W,
          baseWidth = PILLAR_W * 1.65,
          baseHeight = 1.35,
          topTenon = null,
          frontCutoutRight = null,
          frontCutoutLeft = null,
          centerRectHole = null,
          rimSlot = null
        } = options;

        const s = new THREE.Shape();
        const hw = width / 2;
        const bhw = baseWidth / 2;
        const hh = height / 2;
        const baseTopY = -hh + baseHeight;
        const tabD = 0.28;

        // 하단 3개 결합 돌기
        s.moveTo(-bhw, -hh);
        s.lineTo(-bhw * 0.72, -hh);
        s.lineTo(-bhw * 0.72, -hh - tabD);
        s.lineTo(-bhw * 0.35, -hh - tabD);
        s.lineTo(-bhw * 0.35, -hh);

        s.lineTo(-hw * 0.38, -hh);
        s.lineTo(-hw * 0.38, -hh - tabD);
        s.lineTo(hw * 0.38, -hh - tabD);
        s.lineTo(hw * 0.38, -hh);

        s.lineTo(bhw * 0.35, -hh);
        s.lineTo(bhw * 0.35, -hh - tabD);
        s.lineTo(bhw * 0.72, -hh - tabD);
        s.lineTo(bhw * 0.72, -hh);
        s.lineTo(bhw, -hh);

        // 우측 변 (+hw) 상승
        s.lineTo(bhw, baseTopY);
        s.lineTo(hw, baseTopY);

        if (frontCutoutRight) {
          s.lineTo(hw, frontCutoutRight.yMin);
          s.lineTo(hw - frontCutoutRight.depth, frontCutoutRight.yMin);
          s.lineTo(hw - frontCutoutRight.depth, frontCutoutRight.yMax);
          s.lineTo(hw, frontCutoutRight.yMax);
        }

        s.lineTo(hw, hh);

        // 상단 변 (상부 T 연결판과 맞물리는 상향 돌기)
        if (topTenon) {
          const tw = topTenon.w / 2;
          s.lineTo(tw, hh);
          s.lineTo(tw, hh + topTenon.h);
          s.lineTo(-tw, hh + topTenon.h);
          s.lineTo(-tw, hh);
        }
        s.lineTo(-hw, hh);

        // 좌측 변 (-hw) 하강
        if (frontCutoutLeft) {
          s.lineTo(-hw, frontCutoutLeft.yMax);
          s.lineTo(-hw + frontCutoutLeft.depth, frontCutoutLeft.yMax);
          s.lineTo(-hw + frontCutoutLeft.depth, frontCutoutLeft.yMin);
          s.lineTo(-hw, frontCutoutLeft.yMin);
        }

        s.lineTo(-hw, baseTopY);
        s.lineTo(-bhw, baseTopY);
        s.closePath();

        // 배선용 긴 창 (후면 기둥)
        if (centerRectHole) {
          const hole = new THREE.Path();
          const chw = centerRectHole.w / 2;
          const chh = centerRectHole.h / 2;
          const cy = centerRectHole.y;
          hole.moveTo(-chw, cy - chh);
          hole.lineTo(chw, cy - chh);
          hole.lineTo(chw, cy + chh);
          hole.lineTo(-chw, cy + chh);
          hole.closePath();
          s.holes.push(hole);
        }

        // 림 손잡이 박힘용 가로 슬롯 (후면 기둥)
        if (rimSlot) {
          const slot = new THREE.Path();
          const sw = rimSlot.w / 2;
          const sh = rimSlot.h / 2;
          const sy = rimSlot.y;
          slot.moveTo(-sw, sy - sh);
          slot.lineTo(sw, sy - sh);
          slot.lineTo(sw, sy + sh);
          slot.lineTo(-sw, sy + sh);
          slot.closePath();
          s.holes.push(slot);
        }

        const g = new THREE.ExtrudeGeometry(s, { depth: T, bevelEnabled: false });
        // Z축만 중앙 정렬하여 Y 높이 및 초음파 홈/상단 돌기 위치가 정확히 유지되도록 함
        g.translate(0, 0, -T / 2);
        return g;
      }

      // 초음파 센서 파임 홈 사양 (센서 기판 높이 0.95에 맞춘 정밀 홈: ±0.52, 깊이 0.58)

      // 6-1) 정면(앞) 기둥: 초음파 센서 하단 바로 아래까지 깔끔하게 올라옴
      const pillarFrontGeo = createPdfPillarGeo({
        height: FRONT_PILLAR_H,

        assembledRot: [0, 0, 0],

        explodedRot: [-Math.PI / 2, 0, 0],
        labelOffset: [0, 0, 0.9]
      });

      // 6-2) 중앙이 뚫려있는 기둥 (후면): 상부 T 연결판용 돌기 + 림 손잡이 체결 가로 슬롯 포함
      const pillarBackGeo = createPdfPillarGeo({
        height: PILLAR_H,
        width: PILLAR_W - T * 2,
        baseWidth: PILLAR_W * 1.55,
        baseHeight: 1.35,

        rimSlot: { w: 0.78, h: 0.28, y: RIM_Y - PILLAR_CENTER_Y }

      registerPart({

      // 6-3) L(좌측) 기둥: rotY = -PI/2 -> 로컬 +X가 정면(+Z)이므로 frontCutoutRight 사용
      const pillarLGeo = createPdfPillarGeo({
        height: PILLAR_H,

      const pillarLMesh = createPlywoodMesh(pillarLGeo, {
        letter: { text: 'L', x: 256, y: 440, size: 58 }

      registerPart({
        id: 'pillarL',
        name: '기둥 ③ L(좌측) [파랑 홈]',

        explodedRot: [-Math.PI / 2, 0, -Math.PI / 2],
        labelOffset: [0, 0, 1.1]
      });

      // 6-4) R(우측) 기둥: rotY = +PI/2 -> 로컬 -X가 정면(+Z)이므로 frontCutoutLeft 사용
      const pillarRGeo = createPdfPillarGeo({
        height: PILLAR_H,
        width: PILLAR_W,
        baseWidth: PILLAR_W * 1.75,
        baseHeight: 1.35,
        topTenon: { w: 0.76, h: T + 0.08 },
        frontCutoutLeft: sensorCutoutSpec
      });
      const pillarRMesh = createPlywoodMesh(pillarRGeo, {
        letter: { text: 'R', x: 256, y: 440, size: 58 }

      registerPart({

        name: '기둥 ④ R(우측) [빨강 홈]',
        label: '④ R(우측) 기둥',

        labelOffset: [0, 0, 1.1]
      });

      // --- [STEP 8] 초음파 센서 기둥에 끼우기 ---
      function createUltrasonicSensor() {
        const group = new THREE.Group();
        const pcbMat = new THREE.MeshStandardMaterial({ color: 0x1d4ed8, roughness: 0.4 });
        const metalMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.85, roughness: 0.2 });
        const darkMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.6 });

        const pcb = new THREE.Mesh(new THREE.BoxGeometry(2.05, 0.95, 0.14), pcbMat);
        pcb.castShadow = true;
        group.add(pcb);

        [-0.56, 0.56].forEach(x => {
          const cyl = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.54, 24), metalMat);
          cyl.rotation.x = Math.PI / 2;
          cyl.position.set(x, 0, 0.32);
          cyl.castShadow = true;
          group.add(cyl);

          const core = new THREE.Mesh(new THREE.CylinderGeometry(0.23, 0.23, 0.56, 20), darkMat);
          core.rotation.x = Math.PI / 2;
          core.position.set(x, 0, 0.33);
          group.add(core);
        });

        return group;
      }

      registerPart({
        id: 'ultrasonic',
        name: '초음파 센서 (HC-SR04)',
        label: '초음파 센서',
        stepIndex: 8,
        mesh: createUltrasonicSensor(),
        // PCB가 좌우 기둥 정면 홈(z = 0.37..0.95) 안에 쏙 들어가고 원통부가 정면으로 돌출
        assembledPos: [0, SENSOR_Y, PILLAR_W / 2 - 0.18],
        assembledRot: [0, 0, 0],
        explodedPos: [-4.8, 0.5, 4.8],
        explodedRot: [0, 0, 0],
        labelOffset: [0, 1.0, 0]
      });

      // --- [STEP 9] 상부 T 연결판 (수정 3: 정확한 T자 형상 + 기둥 3면 돌기 홈 + 백보드 3갈고리 맞물림) ---
      function createHookTopCapGeo() {
        // 회전 [-PI/2, 0, 0] 적용 시: 로컬 (x, y) -> 월드 (X = x, Z = -y)
        // 따라서 로컬 -Y가 월드 정면(+Z), 로컬 +Y가 월드 후면(-Z)이 됨.
        const s = new THREE.Shape();

        const stemHalfW = 1.20;               // 기둥 상단 덮개 폭 (좌우 기둥 ±0.95를 안정적으로 덮음)
        const rearY = 1.18;                   // 월드 Z = -1.18 (후면 기둥 -0.95 뒤로 여유)
        const neckY = -0.35;                  // 월드 Z = +0.35 (T자 가로 막대 시작점)
        const barHalfW = 2.10;                // T자 앞쪽 가로 막대 폭 (전체 4.20)
        const frontFaceY = -(BB_Z - T / 2);   // 월드 Z = +0.97 (백보드 F 뒷면과 완전 밀착)
        const tabTipY = -(BB_Z + T / 2 + 0.22); // 월드 Z = +1.43 (백보드 F 관통 후 앞쪽 돌출)
        const tabHalfW = 0.34;                // 각 갈고리 탭 폭 0.68 (백보드 슬롯 0.72에 정확히 삽입)

        // 시계 반대 방향으로 T자 외곽선 + 정면 3개 결합 갈고리 생성
        s.moveTo(-stemHalfW, rearY);
        s.lineTo(-stemHalfW, neckY);
        s.lineTo(-barHalfW, neckY);
        s.lineTo(-barHalfW, frontFaceY);

        // 왼쪽 갈고리 (x = -1.45)
        s.lineTo(-1.45 - tabHalfW, frontFaceY);
        s.lineTo(-1.45 - tabHalfW, tabTipY);
        s.lineTo(-1.45 + tabHalfW, tabTipY);
        s.lineTo(-1.45 + tabHalfW, frontFaceY);

        // 중앙 갈고리 (x = 0)
        s.lineTo(-tabHalfW, frontFaceY);
        s.lineTo(-tabHalfW, tabTipY);
        s.lineTo(tabHalfW, tabTipY);
        s.lineTo(tabHalfW, frontFaceY);

        // 오른쪽 갈고리 (x = +1.45)
        s.lineTo(1.45 - tabHalfW, frontFaceY);
        s.lineTo(1.45 - tabHalfW, tabTipY);
        s.lineTo(1.45 + tabHalfW, tabTipY);
        s.lineTo(1.45 + tabHalfW, frontFaceY);

        s.lineTo(barHalfW, frontFaceY);
        s.lineTo(barHalfW, neckY);
        s.lineTo(stemHalfW, neckY);
        s.lineTo(stemHalfW, rearY);
        s.closePath();

        // 기둥 3면(L, R, 후면)의 상단 돌기가 정확히 끼워지는 사각 구멍 3개
        const mortiseHoles = [
          // pillarL 상단 돌기 (월드 X = -0.83, Z = 0 -> 로컬 x = -0.83, y = 0)
          { x: -PILLAR_W / 2 + T / 2, y: 0, w: 0.28, h: 0.80 },
          // pillarR 상단 돌기 (월드 X = +0.83, Z = 0 -> 로컬 x = +0.83, y = 0)
          { x: PILLAR_W / 2 - T / 2, y: 0, w: 0.28, h: 0.80 },
          // pillarBack 상단 돌기 (월드 X = 0, Z = -0.83 -> 로컬 x = 0, y = +0.83)
          { x: 0, y: PILLAR_W / 2 - T / 2, w: 0.68, h: 0.28 }
        ];

        mortiseHoles.forEach(h => {
          const path = new THREE.Path();
          path.moveTo(h.x - h.w / 2, h.y - h.h / 2);
          path.lineTo(h.x + h.w / 2, h.y - h.h / 2);
          path.lineTo(h.x + h.w / 2, h.y + h.h / 2);
          path.lineTo(h.x - h.w / 2, h.y + h.h / 2);
          path.closePath();
          s.holes.push(path);
        });

        const g = new THREE.ExtrudeGeometry(s, { depth: T, bevelEnabled: false });
        // Z축만 중앙 정렬하여 기둥 구멍과 정면 3갈고리 좌표가 정확히 맞물리도록 함
        g.translate(0, 0, -T / 2);
        return g;
      }

      const topCapMesh = createPlywoodMesh(createHookTopCapGeo(), {
        letter: { text: 'T', x: 256, y: 245, size: 78 }
      });
      registerPart({
        id: 'topCap',
        name: '상부 T 연결판 (T)',
        label: '상부 T 연결판',
        stepIndex: 9,
        mesh: topCapMesh,
        assembledPos: [0, TOP_CAP_Y, 0],
        assembledRot: [-Math.PI / 2, 0, 0],
        explodedPos: [4.8, T / 2, 5.4],
        explodedRot: [-Math.PI / 2, 0, 0],
        labelOffset: [0, 0, 1.0]
      });

      // --- [STEP 10] 백보드(F) 및 원형 골대 링 (수정 3 & 4 반영) ---
      const backboardGeo = createFingerPanelGeo(BB_W, BB_H, {
        circleHole: { r: 1.05, yOffset: -0.15 },
        extraHoles: [
          // 상부 T 연결판의 3개 정면 갈고리가 관통하는 상단 슬롯 3개
          { x: -1.45, y: BB_TOP_SLOT_LOCAL_Y, w: 0.72, h: 0.28 },
          { x: 0, y: BB_TOP_SLOT_LOCAL_Y, w: 0.72, h: 0.28 },
          { x: 1.45, y: BB_TOP_SLOT_LOCAL_Y, w: 0.72, h: 0.28 },
          // 골대 링의 손잡이(일자 탭)가 관통하여 기둥으로 들어가는 하단 슬롯
          { x: 0, y: RIM_SLOT_LOCAL_Y, w: 0.78, h: 0.28 }
        ]
      });
      const backboardMesh = createPlywoodMesh(backboardGeo, {
        letter: { text: 'F', x: 425, y: 415, size: 58 }
      });

      registerPart({
        id: 'backboardF',
        name: '전면 백보드 (F)',
        label: '백보드 F',
        stepIndex: 10,
        mesh: backboardMesh,
        assembledPos: [0, BB_Y, BB_Z],
        assembledRot: [0, 0, 0],
        explodedPos: [0, T / 2, 5.4],
        explodedRot: [-Math.PI / 2, 0, 0],
        labelOffset: [0, 0, 1.1]
      });

      // 수정 4: 링 원형 중심을 (0,0)에 두고 돋보기 손잡이 부분을 +Y 방향으로 연장
      // 회전 [-PI/2, 0, 0] 시 손잡이가 뒤쪽(-Z)으로 뻗어 백보드 F 하단 슬롯을 지나 후면 기둥(②) 홈에 깊숙이 박힘
      function createRimGeo() {
        const shape = new THREE.Shape();
        const halfAngle = Math.asin((RIM_TAB_W / 2) / RIM_OUTER_R);

        // 원형 링 외곽: 상단(+Y) 손잡이 연결부 왼쪽에서 시작해 반시계 방향으로 돌아 오른쪽까지
        shape.absarc(
          0,
          0,
          RIM_OUTER_R,
          Math.PI / 2 + halfAngle,
          Math.PI / 2 - halfAngle + Math.PI * 2,
          false
        );

        // 돋보기 손잡이(일자 탭) 부분을 +Y(회전 후 뒤쪽 -Z)로 연장
        shape.lineTo(RIM_TAB_W / 2, RIM_OUTER_R + RIM_TAB_LEN);
        shape.lineTo(-RIM_TAB_W / 2, RIM_OUTER_R + RIM_TAB_LEN);
        shape.closePath();

        // 중앙 원형 구멍
        const hole = new THREE.Path();
        hole.absarc(0, 0, RIM_INNER_R, 0, Math.PI * 2, true);
        shape.holes.push(hole);

        const g = new THREE.ExtrudeGeometry(shape, { depth: T, bevelEnabled: false, curveSegments: 48 });
        // g.center() 대신 Z축만 중앙 정렬하여 원형 중심(0,0)과 손잡이 연장 좌표가 정확히 유지되도록 함
        g.translate(0, 0, -T / 2);
        return g;
      }

      const rimMesh = createPlywoodMesh(createRimGeo());
      registerPart({
        id: 'rim',
        name: '원형 농구 골대 링 (손잡이 기둥 삽입)',
        label: '골대 링',
        stepIndex: 10,
        mesh: rimMesh,
        assembledPos: [0, RIM_Y, RIM_Z],
        assembledRot: [-Math.PI / 2, 0, 0],
        explodedPos: [5.5, T / 2, 1.5],
        explodedRot: [-Math.PI / 2, 0, 0],
        labelOffset: [0, 0, 0.9]
      });

      // --- [STEP 11] 남은 센서 양면 테이프로 붙이기 (네오픽셀, 푸시 버튼, 부저 스피커) ---
      function createNeoPixelRing() {
        const group = new THREE.Group();
        const ringShape = new THREE.Shape();
        ringShape.absarc(0, 0, 1.48, 0, Math.PI * 2, false);
        const hole = new THREE.Path();
        hole.absarc(0, 0, 1.08, 0, Math.PI * 2, true);
        ringShape.holes.push(hole);

        const ringGeo = new THREE.ExtrudeGeometry(ringShape, { depth: 0.14, bevelEnabled: false, curveSegments: 36 });
        ringGeo.translate(0, 0, -0.07);
        const ringPcb = new THREE.Mesh(ringGeo, new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.5 }));
        ringPcb.castShadow = true;
        group.add(ringPcb);

        const ledMat = new THREE.MeshStandardMaterial({
          color: 0xffffff,
          emissive: 0x38bdf8,
          emissiveIntensity: 0.85,
          roughness: 0.2
        });

        const count = 12;
        for (let i = 0; i < count; i++) {
          const ang = (i / count) * Math.PI * 2;
          const led = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.24, 0.1), ledMat);
          led.position.set(Math.cos(ang) * 1.28, Math.sin(ang) * 1.28, 0.1);
          led.rotation.z = ang;
          group.add(led);
        }
        return group;
      }

      registerPart({
        id: 'neopixel',
        name: '네오픽셀 LED 링 (백보드 부착)',
        label: '네오픽셀',
        stepIndex: 11,
        mesh: createNeoPixelRing(),
        assembledPos: [0, BB_Y - 0.15, BB_Z + T / 2 + 0.08],
        assembledRot: [0, 0, 0],
        explodedPos: [-4.8, 0.15, 1.4],
        explodedRot: [-Math.PI / 2, 0, 0],
        labelOffset: [0, 1.7, 0]
      });

      function createButtonModule() {
        const group = new THREE.Group();
        const pcb = new THREE.Mesh(

        );

        group.add(pcb);

        const cap = new THREE.Mesh(

        return group;
      }

      registerPart({
        id: 'buttonModule',
        name: '푸시 버튼 (상판 좌측 부착)',
        label: '푸시 버튼',
        stepIndex: 11,
        mesh: createButtonModule(),
        assembledPos: [-2.35, PILLAR_BASE_Y + 0.08, 1.45],
        assembledRot: [0, 0.25, 0],
        explodedPos: [-4.8, 0.15, -2.5],
        explodedRot: [0, 0, 0],
        labelOffset: [0, 0.95, 0]
      });

      function createBuzzerModule() {
        const group = new THREE.Group();
        const pcb = new THREE.Mesh(
          new THREE.BoxGeometry(0.95, 0.14, 1.15),

        );
        pcb.castShadow = true;
        group.add(pcb);

        const cyl = new THREE.Mesh(

        );
        cyl.position.set(0, 0.25, 0.15);
        cyl.castShadow = true;

        const hole = new THREE.Mesh(

      registerPart({
        id: 'buzzerModule',
        name: '부저 스피커 (상판 우측 부착)',
        label: '부저 스피커',
        stepIndex: 11,
        mesh: createBuzzerModule(),
        assembledPos: [2.35, PILLAR_BASE_Y + 0.08, 1.45],
        assembledRot: [0, -0.25, 0],
        explodedPos: [4.8, 0.15, -2.5],
        explodedRot: [0, 0, 0],
        labelOffset: [0, 0.95, 0]
      });

      // =========================================================================
      // 6. 좌측 사이드바 접기/펼치기 & 인터랙티브 상태 관리
      // =========================================================================
      const guideSidebar = document.getElementById('guide-sidebar');
      const collapseSidebarBtn = document.getElementById('collapse-sidebar-btn');
      const expandSidebarBtn = document.getElementById('expand-sidebar-btn');
      const collapsedStepBadge = document.getElementById('collapsed-step-badge');
      let isSidebarCollapsed = false;

      function setSidebarCollapsed(collapsed) {
        isSidebarCollapsed = collapsed;
        if (isSidebarCollapsed) {
          guideSidebar.classList.remove('translate-x-0');
          guideSidebar.classList.add('-translate-x-[calc(100%+24px)]');

          expandSidebarBtn.classList.remove('-translate-x-[150%]', 'opacity-0', 'pointer-events-none');
          expandSidebarBtn.classList.add('translate-x-0', 'opacity-100', 'pointer-events-auto');
        } else {
          guideSidebar.classList.remove('-translate-x-[calc(100%+24px)]');
          guideSidebar.classList.add('translate-x-0');

          expandSidebarBtn.classList.remove('translate-x-0', 'opacity-100', 'pointer-events-auto');
          expandSidebarBtn.classList.add('-translate-x-[150%]', 'opacity-0', 'pointer-events-none');
        }
      }

      collapseSidebarBtn.addEventListener('click', () => setSidebarCollapsed(true));
      expandSidebarBtn.addEventListener('click', () => setSidebarCollapsed(false));

      const MAX_PROGRESS = 1100;
      let currentProgress = 0;
      let targetProgress = 0;
      let isPlaying = false;
      let activeStep = 0;

      const slider = document.getElementById('progress-slider');
      const playBtn = document.getElementById('play-btn');
      const playText = document.getElementById('play-text');
      const playIcon = document.getElementById('play-icon');
      const stepBadge = document.getElementById('step-badge');
      const progressPercent = document.getElementById('progress-percent');
      const stepTitle = document.getElementById('step-title');
      const stepPartsTag = document.getElementById('step-parts-tag');
      const stepDesc = document.getElementById('step-desc');
      const stepTip = document.getElementById('step-tip');
      const stepPills = document.querySelectorAll('.step-pill');

      function updateStepUI(stepIdx, rawProgress) {
        const data = STEPS_DATA[stepIdx] || STEPS_DATA[0];
        stepBadge.textContent = `STEP ${stepIdx} / 11`;
        collapsedStepBadge.textContent = `${stepIdx}/11`;
        progressPercent.textContent = `${Math.round((rawProgress / MAX_PROGRESS) * 100)}%`;
        stepTitle.textContent = data.title;
        stepPartsTag.textContent = `사용 부품: ${data.parts}`;
        stepDesc.textContent = data.desc;
        stepTip.textContent = data.tip;

        stepPills.forEach(pill => {
          const s = Number(pill.dataset.step);
          if (s === stepIdx) {
            pill.className = 'step-pill px-2 py-1.5 rounded-lg text-[11px] font-semibold truncate transition bg-amber-600 text-white shadow-sm';
          } else if (s < stepIdx) {
            pill.className = 'step-pill px-2 py-1.5 rounded-lg text-[11px] font-semibold truncate transition bg-amber-100 text-amber-800 hover:bg-amber-200';
          } else {
            pill.className = 'step-pill px-2 py-1.5 rounded-lg text-[11px] font-semibold truncate transition bg-slate-100 text-slate-600 hover:bg-slate-200';
          }
        });
      }

      function setTargetProgress(val, stopAuto = true) {
        targetProgress = Math.max(0, Math.min(MAX_PROGRESS, val));
        slider.value = Math.round(targetProgress);
        if (stopAuto && isPlaying) {
          togglePlay(false);
        }
      }

      function togglePlay(forceState = null) {
        isPlaying = forceState !== null ? forceState : !isPlaying;
        if (isPlaying) {
          if (targetProgress >= MAX_PROGRESS - 1) {
            currentProgress = 0;
            targetProgress = 0;
          }
          playText.textContent = '일시 정지';
          playIcon.innerHTML = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
        } else {
          playText.textContent = '자동 조립';
          playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
        }
      }

      slider.addEventListener('input', (e) => {
        setTargetProgress(Number(e.target.value), true);
      });

      playBtn.addEventListener('click', () => togglePlay());

      document.getElementById('prev-btn').addEventListener('click', () => {
        const prevStep = Math.max(0, Math.ceil(targetProgress / 100) - 1);
        setTargetProgress(prevStep * 100, true);
      });

      document.getElementById('next-btn').addEventListener('click', () => {
        const nextStep = Math.min(11, Math.floor(targetProgress / 100) + 1);
        setTargetProgress(nextStep * 100, true);
      });

      stepPills.forEach(pill => {
        pill.addEventListener('click', () => {
          const s = Number(pill.dataset.step);
          setTargetProgress(s * 100, true);
        });
      });

      const toggleLabelsBtn = document.getElementById('toggle-labels-btn');
      toggleLabelsBtn.addEventListener('click', () => {
        showLabels = !showLabels;
        labelSprites.forEach(sp => {
          sp.visible = showLabels;
        });
        if (showLabels) {
          toggleLabelsBtn.className = 'px-2.5 sm:px-3 py-1.5 rounded-xl text-xs font-semibold bg-amber-600 text-white shadow-sm hover:bg-amber-700 transition flex items-center gap-1.5';
          toggleLabelsBtn.innerHTML = '<span class="w-2 h-2 rounded-full bg-white"></span><span>부품 번호 ON</span>';
        } else {
          toggleLabelsBtn.className = 'px-2.5 sm:px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-200 text-slate-700 hover:bg-slate-300 transition flex items-center gap-1.5';
          toggleLabelsBtn.innerHTML = '<span class="w-2 h-2 rounded-full bg-slate-500"></span><span>부품 번호 OFF</span>';
        }
      });

      const toggleXrayBtn = document.getElementById('toggle-xray-btn');
      function setXrayMode(enabled) {
        xrayMode = enabled;
        assemblyParts.forEach(part => {
          if (part.mesh && part.mesh.userData && part.mesh.userData.isWood) {
            const isBottom = part.id === 'B';
            const targetOpacity = xrayMode ? (isBottom ? 0.85 : 0.24) : 1.0;
            part.mesh.userData.faceMat.opacity = targetOpacity;
            part.mesh.userData.edgeMat.opacity = targetOpacity;
            part.mesh.userData.faceMat.depthWrite = !xrayMode || isBottom;
          }
        });

        if (xrayMode) {
          toggleXrayBtn.className = 'px-2.5 sm:px-3 py-1.5 rounded-xl text-xs font-semibold bg-blue-600 text-white shadow-sm hover:bg-blue-700 transition flex items-center gap-1.5';
          toggleXrayBtn.innerHTML = '<span>🔍 투명 투시 ON</span>';
        } else {
          toggleXrayBtn.className = 'px-2.5 sm:px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 text-slate-700 hover:bg-slate-200 transition flex items-center gap-1.5';
          toggleXrayBtn.innerHTML = '<span>🔍 투명 투시(아두이노·배선)</span>';
        }
      }

      toggleXrayBtn.addEventListener('click', () => setXrayMode(!xrayMode));

      let camTransition = null;
      const CAM_PRESETS = {
        iso: { pos: [16, 15, 20], target: [0, 7.2, 0] },
        front: { pos: [0, 9.0, 23], target: [0, 8.0, 0] },
        back: { pos: [0, 9.5, -22], target: [0, 8.5, 0] },
        right: { pos: [23, 9.0, 0], target: [0, 8.0, 0] },
        left: { pos: [-23, 9.0, 0], target: [0, 8.0, 0] },
        top: { pos: [6.8, 19.2, 9.2], target: [0, 14.8, 0.8] },
        inside: { pos: [7.5, 6.2, -9.5], target: [0, 2.2, -0.8] }
      };

      document.querySelectorAll('.cam-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const key = btn.dataset.cam;
          const preset = CAM_PRESETS[key];
          if (preset) {
            if (key === 'inside' && !xrayMode) {
              setXrayMode(true);
            }
            camTransition = {
              targetPos: new THREE.Vector3(...preset.pos),
              targetLook: new THREE.Vector3(...preset.target),
              alpha: 0
            };
          }
        });
      });

      controls.addEventListener('start', () => {
        camTransition = null;
      });

      function easeInOutCubic(t) {
        return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      }

      // =========================================================================
      // 7. 메인 애니메이션 루프
      // =========================================================================
      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);
        const dt = clock.getDelta();

        if (isPlaying) {
          targetProgress += dt * 88;
          if (targetProgress >= MAX_PROGRESS) {
            targetProgress = MAX_PROGRESS;
            togglePlay(false);
          }
          slider.value = Math.round(targetProgress);
        }

        currentProgress += (targetProgress - currentProgress) * Math.min(1, dt * 10);
        if (Math.abs(targetProgress - currentProgress) < 0.05) {
          currentProgress = targetProgress;
        }

        const computedStep = currentProgress < 5
          ? 0
          : Math.min(11, Math.ceil(currentProgress / 100));

        if (computedStep !== activeStep) {
          activeStep = computedStep;
          updateStepUI(activeStep, currentProgress);
        } else {
          progressPercent.textContent = `${Math.round((currentProgress / MAX_PROGRESS) * 100)}%`;
        }

        assemblyParts.forEach(part => {
          const stepStart = (part.stepIndex - 1) * 100;
          const rawT = Math.max(0, Math.min(1, (currentProgress - stepStart) / 100));
          const t = easeInOutCubic(rawT);

          if (part.id === 'neoWires' || part.id === 'ultrasonicWires' || part.id === 'peripheralWires') {
            part.group.visible = rawT > 0.02;
            part.group.scale.setScalar(Math.max(0.01, t));
            part.group.position.set(0, (1 - t) * 1.8, 0);
            return;
          }

          const pos = new THREE.Vector3().lerpVectors(part.explodedPos, part.assembledPos, t);
          if (rawT > 0 && rawT < 1) {
            pos.y += Math.sin(rawT * Math.PI) * 3.8;
          }
          part.group.position.copy(pos);

          const qStart = new THREE.Quaternion().setFromEuler(part.explodedRot);
          const qEnd = new THREE.Quaternion().setFromEuler(part.assembledRot);
          part.group.quaternion.slerpQuaternions(qStart, qEnd, t);

          if (part.mesh.userData && part.mesh.userData.faceMat) {
            const isActivelyMoving = rawT > 0.01 && rawT < 0.99;
            part.mesh.userData.faceMat.emissive.setHex(isActivelyMoving ? 0xd97706 : 0x000000);
            part.mesh.userData.faceMat.emissiveIntensity = isActivelyMoving ? 0.28 : 0;
          }
        });

        if (camTransition) {
          camTransition.alpha += dt * 3.2;
          const k = Math.min(1, camTransition.alpha);
          camera.position.lerp(camTransition.targetPos, 0.14);
          controls.target.lerp(camTransition.targetLook, 0.14);
          if (k >= 1 && camera.position.distanceTo(camTransition.targetPos) < 0.1) {
            camTransition = null;
          }
        }

        controls.update();
        renderer.render(scene, camera);
      }

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      updateStepUI(0, 0);
      animate();
    }

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = src;
        script.onload = resolve;
        script.onerror = reject;
        document.head.appendChild(script);
      });
    }

    async function startWhenReady() {
      try {
        if (typeof THREE === 'undefined') {
          await loadScript('https://unpkg.com/three@0.128.0/build/three.min.js');
        }
        if (typeof THREE !== 'undefined' && typeof THREE.OrbitControls === 'undefined') {
          await loadScript('https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js');
        }
      } catch (err) {
        console.error('Fallback CDN load error:', err);
      }

      if (document.readyState === 'loading') {
        window.addEventListener('DOMContentLoaded', initApp, { once: true });
      } else {
        initApp();
      }
    }

    startWhenReady();
  </script>
</body>
</html>
